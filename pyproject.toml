[project]
name = "registros-camaras-home-assistant"
version = "2.0.0"
requires-python = ">=3.14.2"

[dependency-groups]
dev = ["ruff==0.17.6", "pre-commit==4.7.0", "pytest-homeassistant-custom-component==0.13.375"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
override-dependencies = ["homeassistant==2026.10.3"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
